<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

<style>
  /* 1. Hide the default text on the copy button */
  div.code-toolbar > .toolbar .toolbar-item > button.copy-to-clipboard-button {
    font-size: 0 !important;
    width: 32px;
    height: 32px;
    padding: 6px;
    border-radius: 6px;
    background-color: rgba(255, 255, 255, 0.08);
    background-repeat: no-repeat;
    background-position: center;
    background-size: 16px 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: none;
    transition:
      background-color 0.2s ease,
      border-color 0.2s ease;
    /* Clipboard Icon SVG */
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>');
  }

  /* Hover state */
  div.code-toolbar
    > .toolbar
    .toolbar-item
    > button.copy-to-clipboard-button:hover {
    background-color: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.3);
  }

  /* 2. Success state (Checkmark Icon) */
  div.code-toolbar
    > .toolbar
    .toolbar-item
    > button.copy-to-clipboard-button[data-copy-state="copy-success"] {
    background-color: rgba(46, 160, 67, 0.25) !important;
    border-color: rgba(46, 160, 67, 0.5) !important;
    /* Checkmark Icon SVG */
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%233fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>') !important;
  }
</style>

<script>
  Prism.languages.vesper = {
    comment: [
      {
        pattern: /##[\s\S]*?##/,
        greedy: true,
      },
      {
        pattern: /#.*/,
        greedy: true,
      },
    ],
    string: {
      pattern: /(["'])(?:\\(?:\r\n|[\s\S])|(?!\1)[^\\\r\n])*\1/,
      greedy: true,
    },
    keyword: /\b(?:fn|let|mut|if|else|while|return|struct|import|for)\b/,
    boolean: /\b(?:true|false)\b/,
    type: {
      pattern: /\[*\b(?:int|float|string|bool)\b\]*/,
      alias: "class-name",
    },
    number: /\b0x[\da-f]+\b|\b\d+(?:\.\d+)?\b/i,
    operator: /\*\*|\/\/|==|!=|<=|>=|[-+*\/%<>=]/,
    punctuation: /[{}[\];(),.:]/,
  };
</script>
