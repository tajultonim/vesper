<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="vesper-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- outer: slow continuous drift, starts once the entrance settles -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 8 8" to="360 8 8"
      begin="1s" dur="48s" repeatCount="indefinite"/>

    <!-- entrance: scales and rotates into place once, then freezes -->
    <g transform="translate(8,8)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="0.2;1.12;0.96;1" keyTimes="0;0.6;0.8;1"
          calcMode="spline" keySplines="0.2 0.9 0.25 1;0.2 0.9 0.25 1;0.2 0.9 0.25 1"
          begin="0s" dur="1s" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-35;4;-2;0" keyTimes="0;0.6;0.8;1"
            calcMode="spline" keySplines="0.2 0.9 0.25 1;0.2 0.9 0.25 1;0.2 0.9 0.25 1"
            begin="0s" dur="1s" fill="freeze"/>
          <g transform="translate(-8,-8)" opacity="0">
            <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.6;0.8;1"
              begin="0s" dur="1s" fill="freeze"/>

            <!-- soft bloom, pulses under each tick -->
            <g transform="translate(8,8)">
              <g>
                <animateTransform attributeName="transform" type="scale"
                  values="1;1.4;1;1.4;1;1" keyTimes="0;0.08;0.16;0.24;0.34;1"
                  begin="1s" dur="2.6s" repeatCount="indefinite"/>
                <g transform="translate(-8,-8)">
                  <path fill="#89B4FA" filter="url(#vesper-blur)"
                    d="M 8,0 C 8,5 11,8 16,8 C 11,8 8,11 8,16 C 8,11 5,8 0,8 C 5,8 8,5 8,0 Z">
                    <animate attributeName="opacity"
                      values="0;.55;0;.55;0;0" keyTimes="0;0.08;0.16;0.24;0.34;1"
                      begin="1s" dur="2.6s" repeatCount="indefinite"/>
                  </path>
                </g>
              </g>
            </g>

            <!-- main mark, double-ticks like a clock cycle -->
            <g transform="translate(8,8)">
              <g>
                <animateTransform attributeName="transform" type="scale"
                  values="1;1.15;1;1.15;1;1" keyTimes="0;0.08;0.16;0.24;0.34;1"
                  begin="1s" dur="2.6s" repeatCount="indefinite"/>
                <g transform="translate(-8,-8)">
                  <path fill="#89B4FA"
                    d="M 8,0 C 8,5 11,8 16,8 C 11,8 8,11 8,16 C 8,11 5,8 0,8 C 5,8 8,5 8,0 Z">
                    <animate attributeName="opacity"
                      values="1;1;.9;1;.9;.9" keyTimes="0;0.08;0.16;0.24;0.34;1"
                      begin="1s" dur="2.6s" repeatCount="indefinite"/>
                  </path>
                </g>
              </g>
            </g>

            <!-- core, brightest pulse of the cycle -->
            <g transform="translate(8,8)">
              <g>
                <animateTransform attributeName="transform" type="scale"
                  values="1;1.6;1;1.6;1;1" keyTimes="0;0.08;0.16;0.24;0.34;1"
                  begin="1s" dur="2.6s" repeatCount="indefinite"/>
                <g transform="translate(-8,-8)">
                  <circle cx="8" cy="8" r="1.5" fill="#FFFFFF"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>